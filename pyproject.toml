[project]
name = "hng-7-siftline"
version = "0.1.0"
description = "FastAPI document analysis API for PDF upload, OCR extraction, S3 storage, and LLM-powered summaries."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.17.2",
    "boto3>=1.42.4",
    "fastapi>=0.123.10",
    "httpx>=0.28.1",
    "pdf2image>=1.17.0",
    "pillow>=12.0.0",
    "psycopg2-binary>=2.9.11",
    "pypdf>=6.4.0",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.27",
    "uvicorn[standard]>=0.38.0",
]
